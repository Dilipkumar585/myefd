<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EFD - Live Tracking</title>

    <link rel="stylesheet" href="css/shared-design-system.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/tracking.css">
    <link rel="stylesheet" href="css/loading.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div id="map"><div class="loading-placeholder" style="display:flex;height:100%;align-items:center;justify-content:center;background:#eef3fb;"><div style="text-align:center;"><div class="loading-spinner" style="display:inline-block;width:40px;height:40px;border:4px solid rgba(21,101,192,0.2);border-radius:50%;border-top-color:#1565C0;animation:spin 0.8s linear infinite;margin-bottom:12px;"></div><p>Loading map...</p></div></div></div>

<div class="tracking-container">

<h1><i class="fa-solid fa-location-dot"></i> Live Tracking</h1>

<div id="trackingDetails">

<div class="card">
<h3 style="text-align:center;color:#999;">Loading booking details...</h3>
<p id="distance" style="text-align:center;margin-top:10px;color:#666;">
Calculating distance...
</p>
</div>
</div>

</div>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-BAhfHxDoPJ0QJQ53p4QdxZNKKGsZGPI&libraries=places&callback=initMap">
</script>

<script type="module" src="js/toast.js"></script>
<script type="module" src="js/tracking.js"></script>
</body>

</html>
